name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, ios26-liquid-glass]
    paths-ignore: ['**.md']

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build unsigned archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace CRDeckViewer.xcworkspace \
            -scheme CRDeckViewer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ runner.temp }}/CRDeckViewer.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee ${{ runner.temp }}/xcodebuild.log | tail -50

      - name: Create unsigned IPA
        run: |
          ARCHIVE_PATH="${{ runner.temp }}/CRDeckViewer.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/CRDeckViewer.app"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          zip -r CRDeckViewer-unsigned.ipa Payload
          rm -rf Payload

          echo "IPA created: $(ls -lh CRDeckViewer-unsigned.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRDeckViewer-unsigned
          path: CRDeckViewer-unsigned.ipa
          retention-days: 90
