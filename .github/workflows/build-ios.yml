name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Set version and build number
        run: |
          cd ios
          VERSION="0.${{ github.run_number }}.0"
          agvtool new-marketing-version "$VERSION"
          agvtool new-version -all ${{ github.run_number }}
          echo "Marketing version: $VERSION"
          echo "Build number: ${{ github.run_number }}"

      - name: Build unsigned archive
        working-directory: ios
        run: |
          xcodebuild \
            -workspace CRDeckViewer.xcworkspace \
            -scheme CRDeckViewer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ runner.temp }}/CRDeckViewer.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee ${{ runner.temp }}/xcodebuild.log | tail -50

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Create unsigned IPA
        run: |
          ARCHIVE_PATH="${{ runner.temp }}/CRDeckViewer.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/CRDeckViewer.app"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          zip -r CRDeckViewer-unsigned.ipa Payload
          rm -rf Payload

          echo "IPA created: $(ls -lh CRDeckViewer-unsigned.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRDeckViewer-unsigned
          path: CRDeckViewer-unsigned.ipa
          retention-days: 90

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          TAG="latest-${BRANCH}"
          VERSION="0.${{ github.run_number }}.0"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -f "$TAG"
          git push origin "$TAG" --force
          gh release create "$TAG" CRDeckViewer-unsigned.ipa \
            --title "Latest Build ($BRANCH)" \
            --notes "Unsigned IPA from \`$BRANCH\` branch.
          Version: $VERSION (build ${{ github.run_number }})
          Built: $BUILD_DATE
          Commit: ${{ github.sha }}" \
            --prerelease
